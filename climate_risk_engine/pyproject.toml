[project]
name = "cri"
version = "0.1.0"
description = "Climate Risk Intelligence engine — scenario-driven climate-to-finance translation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "requests>=2.31", "python-multipart>=0.0.9", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Full GIS/raster pipeline — install with: pip install "cri[gis]"
# Enables: GeoPandas spatial joins, xarray NetCDF (ERA5/CMIP6), rasterio COG reads,
#          scipy interpolation for downscaling, shapely geometry operations.
gis = [
    "geopandas>=0.14",
    "xarray>=2024.1",
    "rasterio>=1.3",
    "scipy>=1.12",
    "shapely>=2.0",
    "pyproj>=3.6",
    "netcdf4>=1.6",
    "requests>=2.31",
]
# Satellite data pipeline (AWS open data, COG streaming)
satellite = [
    "rasterio>=1.3",
    "rio-cogeo>=3.6",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "stackstac>=0.5",
    "xarray>=2024.1",
]
# Full spatial analysis (GIS + satellite)
spatial = ["cri[gis,satellite]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
