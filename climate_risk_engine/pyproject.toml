[project]
name = "cri"
version = "0.8.0"
description = "Climate Risk Intelligence engine — scenario-driven climate-to-finance translation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.scripts]
cri = "cri.cli:main"

[project.optional-dependencies]
# ML intelligence layer — ClimateBERT NLP + predictive risk + emissions imputation
ml = [
    "transformers>=4.40",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
]
# Marine heatwave zone (opt-in, CRI_MARINE=1): reads NOAA OISST compressed chunks
marine = [
    "blosc>=1.11",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    "truststore>=0.9; python_version>='3.10'",
    "certifi>=20.5.0.2",    # CA bundle: python.org Python on macOS has none until 'Install Certificates'
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "matplotlib>=3.8",      # story-report figures, research-desk charts, LinkedIn cards
    "supabase>=2.4",
    "cryptography>=42",     # evaluation-licence signature check (cri.licence)
    "fastembed>=0.4",       # offline dense retrieval (bge-small ONNX); the app falls back to keyword search if it is absent
    # Data acquisition layer — autonomous agent
    "httpx>=0.27",          # async HTTP client for GLEIF, EDGAR, CDP, SBTi, Nominatim
    "yfinance>=0.2.37",     # Yahoo Finance market data (revenue, EV, market cap)
    # LLM orchestration layer
    "groq>=0.9",            # Groq client — LLaMA-3.3-70b tool calling for /agent/chat
    # Asset intelligence — /asset/assess (terrain + Sentinel-1/2 + WorldCover)
    "rasterio>=1.3",        # windowed COG reads from AWS / Planetary Computer
    "pysheds>=0.4",         # D8 flow routing in terrain.pysheds_analyzer
    "scipy>=1.11",          # TPI, distance transforms, speckle filtering
    "Pillow>=10.0",         # terrain-tile decoding, true-colour JPEG
    "affine>=2.4",
]
# Minimal JRC flood depth lookup — rasterio binary wheel only, no system GDAL needed
flood = ["rasterio>=1.3"]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Full GIS/raster pipeline — install with: pip install "cri[gis]"
# Enables: GeoPandas spatial joins, xarray NetCDF (ERA5/CMIP6), rasterio COG reads,
#          scipy interpolation for downscaling, shapely geometry operations.
gis = [
    "geopandas>=0.14",
    "xarray>=2024.1",
    "rasterio>=1.3",
    "scipy>=1.12",
    "shapely>=2.0",
    "pyproj>=3.6",
    "netcdf4>=1.6",
    "requests>=2.31",
]
# Satellite data pipeline (AWS open data, COG streaming)
satellite = [
    "rasterio>=1.3",
    "rio-cogeo>=3.6",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "stackstac>=0.5",
    "xarray>=2024.1",
]
# Full spatial analysis (GIS + satellite)
spatial = ["cri[gis,satellite]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
# PRIVATE maintainer tools (authenticated git push) never ship in the wheel / Docker / commercial build.
exclude = ["cri.maintainer", "cri.maintainer.*"]

# Non-Python files that must ship inside the installed package (Docker does
# `pip install ./climate_risk_engine`, which copies only .py files otherwise —
# /asset/dashboard returned 500 on Render because the HTML was missing).
[tool.setuptools.package-data]
"cri.api" = ["*.html", "*.json"]
# carbontlens/ndgain lookups and the emissions calibration + observed-emissions
# files were silently missing from installed builds before this line
"cri.data" = ["*.json", "*.npz", "*.csv.gz"]
"cri.resident" = ["*.js", "data/*.jsonl"]
