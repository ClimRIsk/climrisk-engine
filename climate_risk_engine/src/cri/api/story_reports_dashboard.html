<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClimRisk — Story Reports</title>
<style>
:root{--bg:#0b1220;--panel:#0f172a;--line:#1e293b;--ink:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}header b{letter-spacing:.2em;color:var(--acc)}header span{color:var(--mut);font-size:12px}
.wrap{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 49px)}
aside{border-right:1px solid var(--line);padding:14px;overflow:auto}main{display:flex;flex-direction:column;min-width:0}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;background:var(--panel);border:1px solid #334155;border-radius:7px;color:var(--ink);padding:8px;font-size:13px;font-family:inherit}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.btn{background:var(--acc);color:#04121f;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px}.btn.g{background:transparent;color:var(--acc);border:1px solid #155e75}.btn:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
#bar{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}#bar .btn{flex:none}
#secs{display:flex;gap:12px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}#secs label{display:inline-flex;gap:5px;align-items:center;margin:0;text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink)}#secs input{width:auto}
#msg{padding:8px 14px;color:var(--mut);font-size:12px;min-height:34px}#msg.err{color:#fca5a5}
iframe{flex:1;border:0;background:#0b0f17;color-scheme:dark;width:100%}
.spin{display:inline-block;width:11px;height:11px;border:2px solid #475569;border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite;margin-right:6px;vertical-align:-1px}@keyframes s{to{transform:rotate(360deg)}}
details{margin-top:14px;color:var(--mut);font-size:12px}
</style></head><body>
<header><b>CLIMRISK</b><span>Story reports — each module as a story, customised for the client</span></header>
<div class="wrap">
<aside>
  <label>Report</label><select id="type"></select>
  <div id="fields"></div>
  <div class="row" style="margin-top:10px"><button class="btn g" id="ex">Load worked example</button></div>
  <label>Sector template</label><select id="tpl"></select>
  <label>Client name (on the cover)</label><input id="client" placeholder="e.g. Acme Cement Ltd">
  <div class="row"><div><label>Brand name</label><input id="bname" placeholder="CLIMRISK"></div><div><label>Accent</label><input id="acc" type="color" value="#d4af37" style="padding:2px;height:34px"></div></div>
  <label>Page theme</label><select id="theme"><option value="dark">Dark (research-desk style)</option><option value="light">Light (print)</option></select>
  <label>Logo (PNG, optional)</label><input id="logo" type="file" accept="image/png">
  <label>Footer line</label><input id="foot" placeholder="Prepared for … — confidential">
  <button class="btn" id="build" style="width:100%;margin-top:16px">Build report</button>
  <details><summary>API key (only if required)</summary><input id="apiKey" type="password" placeholder="X-API-Key" style="margin-top:6px"></details>
</aside>
<main>
  <div id="bar"><button class="btn g" data-f="html">Download HTML</button><button class="btn g" data-f="pdf">Download PDF</button><button class="btn g" data-f="markdown">Markdown</button><button class="btn g" data-f="json">JSON</button><span style="color:var(--mut);font-size:12px">Tick sections to include; branding applies instantly. Changing the sector template or inputs needs a rebuild.</span></div>
  <div id="secs"></div><div id="msg">Choose a report, fill the inputs (or load the worked example) and build.</div>
  <iframe id="prev" title="preview"></iframe>
</main></div>
<script>
const $=id=>document.getElementById(id);let CAT=[],TOK=null,SECS=[],TIMER=null;
const hk=(location.hash.match(/key=([^&]+)/)||[])[1]; if(hk) $('apiKey').value=decodeURIComponent(hk);
function H(j){const k=$('apiKey').value.trim()||(localStorage.getItem('cri_api_key')?JSON.parse(localStorage.getItem('cri_api_key')):'');const h=j?{'Content-Type':'application/json'}:{};if(k)h['X-API-Key']=k;return h}
function msg(t,e,spin){$('msg').className=e?'err':'';$('msg').innerHTML=(spin?'<span class="spin"></span>':'')+t}
function cur(){return CAT.find(c=>c.id===$('type').value)}
function drawFields(vals){const c=cur();$('fields').innerHTML=c.fields.map(f=>{const id='f_'+f.k;
  if(f.t==='select')return `<label>${f.l}</label><select id="${id}">${f.o.map(o=>`<option>${o}</option>`).join('')}</select>`;
  if(f.t==='json'||f.t==='area')return `<label>${f.l}</label><textarea id="${id}" spellcheck="false" ${f.t==='area'?'style="min-height:80px;font-family:inherit" placeholder="HEADLINE: Typhoon X hits Y&#10;Peak gust 62 m/s | JMA | https://..."':''}></textarea>`;
  return `<label>${f.l}</label><input id="${id}" type="${f.t==='number'?'number':'text'}" step="any" ${f.d!==undefined?`value="${f.d}"`:''}>`}).join('');
  if(vals)fill(vals)}
function fill(v){const c=cur();c.fields.forEach(f=>{const el=$('f_'+f.k);if(!el||v[f.k]===undefined)return;el.value=f.t==='json'?JSON.stringify(v[f.k],null,2):(typeof v[f.k]==='object'?JSON.stringify(v[f.k]):v[f.k])})}
function collect(){const c=cur(),p={};for(const f of c.fields){const el=$('f_'+f.k);if(!el)continue;let v=el.value.trim();if(v==='')continue;
  if(f.t==='number')v=Number(v);else if(f.t==='json'){try{v=JSON.parse(v)}catch(e){throw new Error(f.l+': invalid JSON')}}p[f.k]=v}return p}
function brand(){const b={};if($('client').value)b.client=$('client').value;if($('bname').value)b.name=$('bname').value;b.accent=$('acc').value;b.theme=$('theme').value;if($('foot').value)b.footer=$('foot').value;if(window._logo)b.logo_b64=window._logo;return b}
$('logo').onchange=e=>{const f=e.target.files[0];if(!f){window._logo=null;return}const r=new FileReader();r.onload=()=>{window._logo=r.result.split(',')[1];sched()};r.readAsDataURL(f)};
async function build(){let p;try{p=collect()}catch(e){return msg(e.message,true)}
  if($('client').value)p.client=$('client').value;const sec=cur().id==='physical'?'several minutes, often 3-5 (3D twin, solver, satellite)':'a few seconds';
  $('build').disabled=true;msg('Building from the engine — '+sec+'…',false,true);
  try{const r=await fetch('/story-reports/build',{method:'POST',headers:H(1),body:JSON.stringify({type:cur().id,payload:p,template:$('tpl').value||null,brand:brand()})});
    const j=await r.json();if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:JSON.stringify(j.detail));
    TOK=j.token;SECS=j.sections;$('secs').innerHTML=SECS.map(s=>`<label><input type="checkbox" data-k="${s.key}" checked>${s.title}</label>`).join('');
    document.querySelectorAll('#secs input').forEach(i=>i.onchange=sched);msg(j.standfirst.replace(/\s*\[\[S:[^\]]+\]\]/g,''));await render()}catch(e){msg(e.message,true)}finally{$('build').disabled=false}}
function keep(){const k=[...document.querySelectorAll('#secs input')].filter(i=>i.checked).map(i=>i.dataset.k);return k.length===SECS.length?null:k}
async function render(){if(!TOK)return;const r=await fetch('/story-reports/render',{method:'POST',headers:H(1),body:JSON.stringify({token:TOK,sections:keep(),brand:brand(),format:'html'})});
  if(!r.ok){msg('Report expired — build it again',true);return}$('prev').srcdoc=await r.text()}
function sched(){clearTimeout(TIMER);TIMER=setTimeout(render,250)}
document.querySelectorAll('#bar .btn').forEach(b=>b.onclick=async()=>{if(!TOK)return msg('Build the report first',true);const f=b.dataset.f;
  const r=await fetch('/story-reports/render',{method:'POST',headers:H(1),body:JSON.stringify({token:TOK,sections:keep(),brand:brand(),format:f==='html'?'html':f})});
  if(!r.ok)return msg('Download failed ('+r.status+')',true);const bl=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='climrisk-'+cur().id+'.'+({html:'html',pdf:'pdf',markdown:'md',json:'json'}[f]);a.click()});
['client','bname','acc','foot'].forEach(i=>$(i).oninput=sched);$('theme').onchange=sched;
$('build').onclick=build;$('type').onchange=()=>{drawFields();TOK=null;$('secs').innerHTML='';$('prev').srcdoc=''};$('ex').onclick=()=>{const e=cur().example;if(e)fill(e);else msg('No worked example for this report — paste your inventory JSON.')};
(async()=>{const r=await fetch('/story-reports/catalogue',{headers:H()});const j=await r.json();CAT=j.reports;
  $('type').innerHTML=CAT.map(c=>`<option value="${c.id}">${c.label}</option>`).join('');
  $('tpl').innerHTML='<option value="">Auto from sector</option>'+Object.entries(j.templates).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  const q=new URLSearchParams(location.search);if(q.get('type')&&CAT.some(c=>c.id===q.get('type')))$('type').value=q.get('type');
  drawFields();const v={};q.forEach((val,k)=>{if(k!=='type'&&k!=='auto')v[k]=['lat','lon','revenue_usd_m','value_usd'].includes(k)?Number(val):val});
  if(v.company&&!v.company_name)v.company_name=v.company;fill(v);if(q.get('client'))$('client').value=q.get('client');
  if(q.get('auto')==='1')build()})();
</script></body></html>
